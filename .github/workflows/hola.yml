name: Práctica

on:
  push:
    branches: [main]
  workflow_dispatch:

  jobs:
  saludo:
    runs-on: ubuntu-latest

        steps:
      - name: Mostrar mensaje
        run: echo "Hola desde GitHub Actions"

      - name: Ver archivos antes de descargar el código
